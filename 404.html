<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Redirecting to lamama9.github.io/sitter</title>
<script>
(function () {
  // The Sitter app's web build moved from this origin's root to /sitter/. Old,
  // already-installed Android builds (0.3.31 and earlier) still send email confirmation/
  // password-reset links pointing at this bare origin (see auth-repository.ts's
  // authDeepLinkRedirect doc comment), so this file - both as index.html and as a byte-identical
  // 404.html - forwards any such link to its new home, preserving the path, query string and hash
  // fragment untouched (the hash in particular carries GoTrue's access_token/refresh_token, which
  // must survive intact).
  //
  // Guard against a redirect loop: if we somehow already ended up under /sitter/ (or exactly at
  // /sitter), do nothing rather than prefixing it a second time.
  var p = location.pathname;
  if (p === '/sitter' || p.indexOf('/sitter/') === 0) return;
  location.replace('/sitter' + p + location.search + location.hash);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="/sitter/">lamama9.github.io/sitter</a>&hellip;</p>
<noscript>
  <a href="/sitter/">Continue to the app</a>
</noscript>
</body>
</html>
